[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "benchmark-toolbox"
version = "0.1.0"
description = "Extensible benchmark toolbox for holistic indoor scene understanding models"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Benchmark Toolbox contributors" }]
dependencies = []

[project.scripts]
benchmark-toolbox = "benchmark_toolbox.cli:main"

[project.urls]
Repository = "https://github.com/HoloPano-dissertation/benchmark-toolbox"
Documentation = "https://github.com/HoloPano-dissertation/benchmark-toolbox/tree/main/docs"

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]

[dependency-groups]
dev = [
  "types-pyyaml>=6.0.12.20250915",
  "pytest>=8.0",
  "shapely>=2.0.7",
  "pytest-cov>=7.1.0",
  "typing-extensions>=4.16.0",
  "pyyaml>=6.0",
  "numpy>=2.0.2",
  "pillow>=11.3.0",
  "scipy>=1.13.1",
  "h5py>=3.14.0",
]

[tool.ruff.lint]
select = [
  "N",
  "UP",
  "E",
  "F",
  "I",
  "LOG",
  "G",
  "B",
  "DTZ",
  "SIM",
  "C4",
  "RET",
  "PTH",
  "ANN",
  "ARG",
  "PT",
  "BLE",
  "RUF",
]
pydocstyle.convention = "google"


[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
tmp_path_retention_policy = "none"
testpaths = ["tests"]
pythonpath = ["runners"]
addopts = "-ra --strict-markers --strict-config"
