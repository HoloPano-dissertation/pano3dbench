[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pano3dbench"
version = "0.1.0"
description = "Pano3DBench: extensible benchmark for holistic indoor scene understanding models"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Pano3DBench contributors" }
]
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
pano3dbench = "pano3dbench.cli:main"

[project.urls]
Repository = "https://github.com/HoloPano-dissertation/pano3dbench"
Documentation = "https://github.com/HoloPano-dissertation/pano3dbench/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["runners"]
addopts = "-ra --strict-markers --strict-config"
tmp_path_retention_policy = "none"
