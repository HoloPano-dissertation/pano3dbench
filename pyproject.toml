[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pano3dbench"
version = "0.1.0"
description = "Pano3DBench: extensible benchmark for holistic indoor scene understanding models"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Pano3DBench contributors" }]
dependencies = [
    "pyyaml>=6.0.3",
]

[project.scripts]
pano3dbench = "pano3dbench.cli:main"

[project.urls]
Repository = "https://github.com/HoloPano-dissertation/pano3dbench"
Documentation = "https://github.com/HoloPano-dissertation/pano3dbench/tree/main/docs"

[dependency-groups]
dev = [
  "types-pyyaml>=6.0.12.20250915",
  "pytest>=8.0",
  "shapely>=2.0.7",
  "pytest-cov>=7.1.0",
  "typing-extensions>=4.16.0",
  "numpy>=2.0.2",
  "pillow>=11.3.0",
  "scipy>=1.13.1",
  "h5py>=3.14.0",
  "types-shapely>=2.1.0.20250917",
]

[tool.ruff.lint]
select = [
  "N",
  "UP",
  "E",
  "F",
  "I",
  "LOG",
  "G",
  "B",
  "DTZ",
  "SIM",
  "C4",
  "RET",
  "PTH",
  "ANN",
  "ARG",
  "PT",
  "BLE",
  "RUF",
]
pydocstyle.convention = "google"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["runners"]
addopts = "-ra --strict-markers --strict-config"
tmp_path_retention_policy = "none"

[tool.ty.environment]
extra-paths = [
  "runners",
  "training",
  "scripts/front3d/adapters",
  "scripts/front3d/qa",
]
