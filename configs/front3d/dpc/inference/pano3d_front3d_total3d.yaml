method: Pano3D
resume: False
finetune: True
weight: [
  '/PATH/TO/out/relation_scene_gcn_front3d/RUN/model_best.pth',
  '/PATH/TO/front3d/training/horizonnet/for_dpc.pth',
  '/PATH/TO/out/mgnet_front3d/RUN/model_best.pth',
]
seed: 123
device:
  use_gpu: True
  gpu_ids: '0'
  num_workers: 0
data:
  split: /PATH/TO/front3d/dpc_scenes/test_split.json
  expand_dis: 0.1
  igibson_obj_dataset: /PATH/TO/front3d/objects
  g_feature_length: 64
  height: 512
  width: 1024
model:
  detector:
    module: Detector2D
    config: 'COCO-InstanceSegmentation/mask_rcnn_R_50_FPN_3x.yaml'
    weight: '/PATH/TO/front3d/training/detector/model_final.pth'
    score_thresh: 0.6
    min_iou: 0.25
    real: False
    pano: True
    cf_thresh: 0.3
    nms_thresh: 0.2
    nms_all_thresh: 0.4
  layout_estimation:
    module: HorizonNet
    loss: HorizonLoss
    backbone: resnet50
    use_rnn: True
  bdb3d_estimation:
    module: Bdb3DNet
    loss: JointLoss
    d_k: 64
    Nr: 16
  mesh_reconstruction:
    module: DensTMNet
    loss: SVRLoss
    tmn_subnetworks: 2
    with_edge_classifier: True
    face_samples: 1
train:
  epochs: 35
  freeze: ['bdb3d_estimation', 'mesh_reconstruction']
  batch_size: 16
val:
  batch_size: 16
test:
  batch_size: 1
log:
  vis_step: 1
  print_step: 10
  save_mesh: False
  path: out/pano3d_front3d_total3d
  save_checkpoint: False
